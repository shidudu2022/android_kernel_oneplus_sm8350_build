name: Build Kernel (With KSU)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v3
      with:
        repository: awakened1712/android_kernel_oneplus_sm8350
        ref: feat-base
        path: sm8350
        fetch-depth: 1

    - name: Checkout gcc toolchain
      uses: actions/checkout@v3
      with:
        repository: mvaisakh/gcc-arm64
        ref: 05cb20a52f12389c3f2340b5103485108feae302
        path: toolchain

    - name: Checkout patches
      uses: actions/checkout@v3
      with:
        ref: build
        path: patches

    - name: Apply patches
      run: |
        cd sm8350
        git submodule add https://github.com/tiann/KernelSU.git
        git submodule update --init --recursive
        git apply ../patches/ksu.patch

    - name: Android kernel build
      run: |
        sudo apt-get update
        sudo apt-get install -y libdebuginfod-dev build-essential flex bison libssl-dev libelf-dev bc rsync libncurses-dev python3 python-is-python3
        export PATH="$(pwd)/toolchain/bin:${PATH}"
        cd sm8350
        bash build.sh
        git log --no-decorate --oneline -n 100 > out/ak3/ChangeLog.txt

    - name: Upload final output
      uses: actions/upload-artifact@v4
      with:
        name: release-ksu
        path: |
          sm8350/out/ak3/ChangeLog.txt
          sm8350/out/ak3/*.zip

    - name: Checkout build repo
      uses: actions/checkout@v4
      with:
        ref: build
        path: build-repo

    - name: Publish GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="ksu-$(date -u '+%Y%m%d-%H%M')"
        TITLE="Kernel with KSU $(date -u '+%Y-%m-%d %H:%M UTC')"
        bash build-repo/.github/scripts/publish-to-release.sh "$TAG" "$TITLE" sm8350/out/ak3
